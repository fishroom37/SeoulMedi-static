name: Run AI Clinic Bot

on:
  workflow_dispatch: # 버튼 누르면 즉시 실행
  schedule:
    - cron: '*/10 * * * *' # 10분마다 자동으로 시트 확인

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치
        run: |
          pip install gspread google-auth requests

      - name: 4. AI 비서 실행
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python ai_assistant.py

      - name: 5. 변경사항 자동 커밋 및 푸시
        run: |
          git config --global user.name "Clinic-AI-Bot"
          git config --global user.email "bot@clinic.local"
          git add js/site/site-core.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "AI 비서: 구글 시트 요청 반영 완료" && git push)
